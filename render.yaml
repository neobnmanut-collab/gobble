# Render blueprint: one web service in Frankfurt that runs the game server and serves the game page.
services:
  - type: web
    name: blobbit
    runtime: node
    region: frankfurt
    plan: free            # free instances sleep after a while without visitors; switch to a paid plan to keep it always on
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node --max-semi-space-size=16 src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"

  # second arena in the USA (east coast, the closest US region to Europe)
  - type: web
    name: gobble-us
    runtime: node
    region: virginia
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node --max-semi-space-size=16 src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
